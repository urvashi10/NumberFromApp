name: Robot Framework CI

# Trigger pipeline on push or pull request to main branch
on:
  push:
    branches: ["dev"]

  pull_request:
    branches: ["dev"]

jobs:
  run-robot-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1 ⇒ Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2 ⇒ Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Step 3 ⇒ Install Chrome (needed for Selenium)
      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-versions: "latest"

      # Step 4 ⇒ Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5 ⇒ Optional: install additional libs if not in requirements.txt
      - name: Install Robot Framework libraries
        run: |
          pip install robotframework
          pip install robotframework-seleniumlibrary
          pip install selenium

      # Step 6 ⇒ Run Robot Framework tests
      - name: Execute Robot Tests
        run: |
          mkdir -p results
          robot --outputdir results tests/

      # Step 7 ⇒ Upload test results as artifacts
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: results
