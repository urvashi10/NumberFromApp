name: Automation Test Suite

on:
  pull_request:
    branches:
      - main  # Triggers whenever a PR is opened against the main branch

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework
          pip install robotframework-seleniumlibrary

      - name: Run Robot Framework Tests
        # We use 'python -m robot' to avoid the security block you faced earlier
        run: python -m robot "automation admin/MasterAgentManagement.robot"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.html
            log.html
            output.xml